# =====================================================================
# olist-dw-hadoop - central configuration
# Sourced by every shell script (Mac side and sandbox side).
# Keep secrets OUT of this file - the Kaggle token lives in ~/.kaggle/.
# =====================================================================

# ---- Source system --------------------------------------------------
KAGGLE_DATASET="olistbr/brazilian-ecommerce"

# ---- Mac (extraction side) ------------------------------------------
# Where the Kaggle download lands on the Mac, one folder per load date.
LOCAL_LANDING="$HOME/olist-landing"

# SSH alias for the sandbox (defined in ~/.ssh/config on the Mac).
SANDBOX_SSH="olist-sandbox"

# ---- Sandbox (edge node) local disk ---------------------------------
# NOTE: these are ordinary Linux folders on the sandbox, NOT HDFS.
SANDBOX_BASE="/opt/olist"
REMOTE_APP_DIR="$SANDBOX_BASE/app"          # deployed copy of this repo
REMOTE_LANDING="$SANDBOX_BASE/landing"      # files arrive here first
AUDIT_LOG="$SANDBOX_BASE/logs/ingest_audit.log"

# ---- HDFS -----------------------------------------------------------
HDFS_BASE="/data/olist"
HDFS_RAW="$HDFS_BASE/raw"                   # immutable source files
HDFS_CURATED="$HDFS_BASE/curated"           # Parquet star schema
HDFS_INGEST_FLAGS="$HDFS_RAW/_ingest"       # one _SUCCESS flag per load date
HDFS_APP_DIR="/apps/olist"                  # code Oozie reads (later step)

# ---- Source tables --------------------------------------------------
# hdfs_folder:csv_name_without_extension:minimum_line_count
# Minimum line counts = the row counts of the first full load; a smaller
# delivery fails validation (catches truncated downloads).
OLIST_TABLES="
orders:olist_orders_dataset:99441
order_items:olist_order_items_dataset:112650
order_payments:olist_order_payments_dataset:103886
order_reviews:olist_order_reviews_dataset:99224
customers:olist_customers_dataset:99441
products:olist_products_dataset:32951
sellers:olist_sellers_dataset:3095
geolocation:olist_geolocation_dataset:1000163
category_translation:product_category_name_translation:71
"
